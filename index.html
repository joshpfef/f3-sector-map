<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>F3 Sectors Map</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }

    /* Hover card */
    .sector-card {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      align-items: start;
      min-width: 320px;
      max-width: 420px;
      padding: 10px;
    }
    .sector-card img {
      width: 72px; height: 72px; object-fit: cover;
      border-radius: 10px;
      background: #eee;
    }
    .sector-card h3 {
      margin: 0 0 6px 0; font-size: 16px; line-height: 1.2;
    }
    .sector-card .meta {
      font-size: 13px; line-height: 1.35;
    }
    .sector-card .meta div { margin-bottom: 4px; }
    .muted { opacity: 0.75; }

    /* Leaflet tooltip styling */
    .leaflet-tooltip.sector-tooltip {
      background: white;
      border: 1px solid rgba(0,0,0,0.15);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      padding: 0;
    }

    .legend {
  background: rgba(255,255,255,0.92);
  padding: 10px 12px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.12);
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  font-size: 13px;
  line-height: 1.25;
  max-height: 50vh;
  overflow: auto;
}
.legend .title {
  font-weight: 700;
  margin-bottom: 8px;
}
.legend .item {
  display: grid;
  grid-template-columns: 14px 1fr;
  gap: 8px;
  align-items: center;
  margin: 6px 0;
}
.legend .swatch {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  border: 1px solid rgba(0,0,0,0.2);
}
.legend .muted {
  opacity: 0.75;
}

    /* little header */
    .topbar {
      position: absolute;
      top: 10px; left: 10px;
      z-index: 999;
      background: rgba(255,255,255,0.9);
      padding: 10px 12px;
      border-radius: 12px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 13px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }
    .topbar b { font-size: 14px; }
  </style>
</head>
<body>
  <div class="topbar">
    <b>F3 Sector Map</b><br>
    Hover a state to view Sector info.
  </div>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
